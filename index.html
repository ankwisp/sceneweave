<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CREATIVE VISUALIZER</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>AI Creative Visualizer</h1>
    <p>Turn your imagination into motion</p>
    <input
      id="promptInput"
      type="text"
      placeholder="Describe a scene, mood, or idea..."
    />
    <button id="generateBtn">Generate</button>
    <canvas id="visualizer"></canvas>
    <div id="aiInfo">
      <span>AI Interpretation</span>
      <div id="aiSettings">
        <div><strong>Mood:</strong> <span id="aiMood">—</span></div>
        <div><strong>Atmosphere:</strong> <span id="aiAtmosphere">—</span></div>
        <div><strong>Energy:</strong> <span id="aiEnergy">—</span></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
